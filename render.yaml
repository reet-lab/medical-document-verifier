services:
  - type: web
    name: medical-document-verifier
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "false"
      - key: RELOAD
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
